<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pair Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  #box { width: 100%; max-width: 400px; padding: 24px; }
  h1 { font-size: 18px; margin-bottom: 12px; }
  p { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
  input {
    width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155;
    background: #1e293b; color: #f1f5f9; font-size: 14px; margin-bottom: 12px;
  }
  button {
    width: 100%; padding: 10px; border-radius: 6px; border: none;
    background: #fbbf24; color: #0f172a; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  #error { color: #f87171; font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
  <div id="box">
    <h1>Pair this display</h1>
    <p>Paste the display URL shown on the cashier's Tax Receipt screen (includes a security token).</p>
    <input id="url" type="text" placeholder="https://xxxx.ngrok-free.app?token=..." />
    <button id="save">Save &amp; Connect</button>
    <div id="error"></div>
  </div>
  <script>
    const input = document.getElementById("url");
    const errorEl = document.getElementById("error");

    document.getElementById("save").addEventListener("click", async () => {
      const url = input.value.trim();
      errorEl.textContent = "";
      if (!url) {
        errorEl.textContent = "Please paste the display URL first.";
        return;
      }
      try {
        new URL(url);
      } catch {
        errorEl.textContent = "That doesn't look like a valid URL.";
        return;
      }
      await window.pairing.save(url);
    });

    window.pairing.get().then((url) => {
      if (url) input.value = url;
    });
  </script>
</body>
</html>
